  let terDirty = true, waterFrame = 0, hasWater = false;

  function cellType(cx, cy){ if (cx < 0 || cy < 0 || cx >= N || cy >= N) return 0; return ter[cy * N + cx]; }
  function setCell(cx, cy, t){ if (cx < 0 || cy < 0 || cx >= N || cy >= N) return; ter[cy * N + cx] = t; terDirty = true; }
  function fillTile(tx, ty, t){ for (let j = 0; j < 2; j++) for (let i = 0; i < 2; i++) setCell(tx * 2 + i, ty * 2 + j, t); }
  function setBaseWall(t){ for (const [tx, ty] of BASE_WALL) fillTile(tx, ty, t); }

  function loadMap(rows){
    ter.fill(0);

        const ch = row[tx] || ".";

  function renderTerrain(){

    if (!terDirty) return;
    terDirty = false;
    tctx.clearRect(0, 0, F, F);
    for (let cy = 0; cy < N; cy++) for (let cx = 0; cx < N; cx++) {

  // ---------- 声音 ----------
  let ac = null, muted = false, eng = null, noiseBuf = null;
  function initAudio(){
    if (ac) return;

    const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
    o.type = "sawtooth"; f.type = "lowpass"; f.frequency.value = 260; g.gain.value = 0;

  function tone(freq, dur, type, vol, to, delay){
    if (!ac || muted) return;
    const t0 = ac.currentTime + (delay || 0);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(freq, t0);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    g.gain.setValueAtTime(vol || 0.05, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

  function noise(dur, vol, freq){
    if (!ac || muted) return;

      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const t0 = ac.currentTime;
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; f.type = "lowpass"; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(ac.destination);
    s.start(t0); s.stop(t0 + dur + 0.02);
  }
  function seq(notes, step, type, vol){ notes.forEach((n, i) => tone(n, step * 0.95, type || "square", vol || 0.05, null, i * step)); }
  const SFX = {
    fire:  () => tone(660, 0.06, "square", 0.05, 220),
    brick: () => noise(0.09, 0.18, 1800),
    steel: () => tone(1400, 0.05, "square", 0.04, 900),
    armor: () => tone(900, 0.05, "square", 0.05, 600),
    boom:  () => { noise(0.45, 0.3, 700); tone(120, 0.35, "triangle", 0.12, 40); },
    bonus: () => seq([1046, 1318, 1568, 2093], 0.05),
    pick:  () => seq([523, 659, 784, 1046, 1318], 0.05),
    life:  () => seq([784, 988, 1175, 1568, 1175, 1568], 0.08),
    start: () => seq([392, 523, 659, 523, 659, 784, 1046], 0.11),
    pause: () => seq([784, 523], 0.1),
    tick:  () => tone(1200, 0.03, "square", 0.03),
    over:  () => seq([523, 392, 330, 262], 0.18, "triangle", 0.08)

  function sfx(n){ if (SFX[n]) SFX[n](); }
  function engine(on, moving){
    if (!eng) return;

  }

  // ---------- 输入 ----------
  const held = new Set(), dirStack = [];
  const DIRKEY = { ArrowUp:0, KeyW:0, ArrowRight:1, KeyD:1, ArrowDown:2, KeyS:2, ArrowLeft:3, KeyA:3 };
  const FIREKEY = ["Space", "KeyJ", "KeyZ", "KeyK"];
  function currentDir(){ return dirStack.length ? DIRKEY[dirStack[dirStack.length - 1]] : -1; }
  function fireHeld(){ return FIREKEY.some(k => held.has(k)); }

  // ---------- 坦克 ----------
  function makeTank(type, x, y){
    const p = type === "player", k = p ? null : EK[type];
    return { type, x, y, dir:p ? 0 : 2, isPlayer:p, speed:p ? 0.75 : k.speed, acc:0,
      hp:p ? 1 : k.hp, score:p ? 0 : k.score, bonus:false, shield:0, armor:false,
      star:p ? playerStar : 0, alive:true, spawnT:60, anim:0, moving:false, ai:0, blockedT:0, cool:0 };
  }
  function spawnPlayer(){ player = makeTank("player", 64, 192); tanks.push(player); }
  function enemiesOnField(){ return tanks.filter(t => !t.isPlayer && t.alive).length; }
  function trySpawnEnemy(){
    if (!queue.length || enemiesOnField() >= 4) return;
    const [x, y] = SPAWNS[spawnIdx % 3]; spawnIdx++;
    const e = makeTank(queue.shift(), x, y);
    e.bonus = spawnedCount === 3 || spawnedCount === 10 || spawnedCount === 17;
    spawnedCount++;
    if (e.bonus) power = null;
    tanks.push(e);
  }

  function overlapBase(x, y, w, h){ return x < 112 && x + w > 96 && y < 208 && y + h > 192; }
  function overlaps(a, x, y){ return x < a.x + 16 && x + 16 > a.x && y < a.y + 16 && y + 16 > a.y; }
  function rectFree(x, y, self){
    if (x < 0 || y < 0 || x + 16 > F || y + 16 > F) return false;
    for (let cy = y >> 2; cy <= (y + 15) >> 2; cy++)
      for (let cx = x >> 2; cx <= (x + 15) >> 2; cx++) {
        const t = ter[cy * N + cx];
        if (t === 1 || t === 2 || t === 3) return false;
      }
    if (overlapBase(x, y, 16, 16)) return false;
    for (const o of tanks) {
      if (o === self || !o.alive) continue;
      if (overlaps(o, x, y) && !overlaps(o, self.x, self.y)) return false;
    }
    return true;
  }
  function moveTank(t){
    const d = DIRS[t.dir];
    let blocked = false;
    t.acc += t.speed;
    while (t.acc >= 1) {
      t.acc -= 1;
      const nx = t.x + d.x, ny = t.y + d.y;
      if (rectFree(nx, ny, t)) { t.x = nx; t.y = ny; }
      else { blocked = true; t.acc = 0; break; }
    }
    return blocked;
  }
  function turn(t, nd){
    if (nd === t.dir) return;
    if ((nd & 1) !== (t.dir & 1)) {
      if (nd & 1) { const sy = Math.round(t.y / 8) * 8; if (sy !== t.y && rectFree(t.x, sy, t)) t.y = sy; }
      else { const sx = Math.round(t.x / 8) * 8; if (sx !== t.x && rectFree(sx, t.y, t)) t.x = sx; }
    }
    t.dir = nd;
  }
  function fire(t){
    const max = t.isPlayer && t.star >= 2 ? 2 : 1;
    if (bullets.filter(b => b.owner === t).length >= max) return;
    const d = DIRS[t.dir];
    const sp = t.isPlayer ? (t.star >= 1 ? 4 : 2) : EK[t.type].bspeed;
    bullets.push({ x:t.x + 8 + d.x * 6, y:t.y + 8 + d.y * 6, dx:d.x, dy:d.y, sp, owner:t,
      isPlayer:t.isPlayer, power:t.isPlayer && t.star >= 3, alive:true });
    t.cool = t.isPlayer ? 8 : 16;
    if (t.isPlayer) sfx("fire");
  }

  function boom(x, y, big, sc){ fx.push({ x, y, t:0, big, score:sc || 0, seed:(Math.random() * 1e6) | 0 }); }
  function addScore(n){
    score += n;
    if (score >= nextLife) { lives++; nextLife += 20000; sfx("life"); }
  }
  function saveHigh(){ if (score > hi) { hi = score; localStorage.setItem(HKEY, String(hi)); } }

  function hitPlayer(){
    if (!player || !player.alive || player.spawnT > 0 || player.shield > 0 || player.armor) return;
    boom(player.x + 8, player.y + 8, true); sfx("boom");
    player.alive = false;
    tanks = tanks.filter(t => t !== player);
    player = null; playerStar = 0;
    lives--;
    if (lives > 0) respawnT = 60; else startOver();
  }
  function hitEnemy(t){
    if (t.bonus) { t.bonus = false; spawnPower(); }
    t.hp--;
    if (t.hp > 0) { sfx("armor"); return; }
    t.alive = false;
    kills[TYPES.indexOf(t.type)]++;
    addScore(t.score);
    boom(t.x + 8, t.y + 8, true, t.score); sfx("boom");
    tanks = tanks.filter(o => o !== t);
  }
  function destroyBase(){
    if (!baseAlive) return;
    baseAlive = false;
    boom(104, 200, true); sfx("boom");
    startOver();
  }
  function startOver(){
    if (over) return;
    over = { y:F, t:0 };
    sfx("over");
  }

  function spawnPower(){
    power = { kind:POWER_KINDS[(Math.random() * POWER_KINDS.length) | 0],
      x:((Math.random() * 25) | 0) * 8, y:((Math.random() * 25) | 0) * 8 };

    if (power.y > 192) power.y = 192;

  }
  function applyPower(kind){
    if (kind === "star") { player.star = Math.min(3, player.star + 1); playerStar = player.star; }
    if (kind === "grenade") {
      for (const t of tanks) if (!t.isPlayer && t.alive && t.spawnT <= 0) { t.alive = false; boom(t.x + 8, t.y + 8, true); }
      tanks = tanks.filter(t => t.alive);
      sfx("boom");
    }
    if (kind === "helmet") { player.shield = 600; player.armor = true; }
    if (kind === "shovel") { shovel = 1200; setBaseWall(2); }
    if (kind === "timer") freeze = 600;
    if (kind === "tank") { lives++; sfx("life"); }
    else sfx("pick");

    pops.push({ x:power.x + 8, y:power.y + 8, t:40, text:"500" });
  }

  function bulletHitsTile(b){
    let lead, c0, c1, s0, s1, vertical = b.dy !== 0;
    if (vertical) {
      lead = (b.dy < 0 ? b.y - 2 : b.y + 1) >> 2;
      c0 = (b.x - 2) >> 2; c1 = (b.x + 1) >> 2;
      s0 = (b.x - 8) >> 2; s1 = (b.x + 7) >> 2;
    } else {
      lead = (b.dx < 0 ? b.x - 2 : b.x + 1) >> 2;
      c0 = (b.y - 2) >> 2; c1 = (b.y + 1) >> 2;
      s0 = (b.y - 8) >> 2; s1 = (b.y + 7) >> 2;
    }
    const at = (a, l) => vertical ? cellType(a, l) : cellType(l, a);
    let hit = false;
    for (let a = c0; a <= c1; a++) { const t = at(a, lead); if (t === 1 || t === 2) hit = true; }
    if (!hit) return false;
    let broke = false;
    const step = vertical ? b.dy : b.dx;
    const depth = b.power ? 2 : 1;
    for (let k = 0; k < depth; k++) {
      const l = lead + k * step;
      for (let a = s0; a <= s1; a++) {

  function stepBullet(b){
    if (b.x - 2 < 0 || b.y - 2 < 0 || b.x + 2 > F || b.y + 2 > F) {

      if (b.isPlayer) sfx("steel");
      return;

    if (bulletHitsTile(b)) return;
    if (baseAlive && overlapBase(b.x - 2, b.y - 2, 4, 4)) { b.alive = false; destroyBase(); return; }
    for (const t of tanks) {
      if (!t.alive || t.spawnT > 0 || t.isPlayer === b.isPlayer) continue;
      if (b.x - 2 < t.x + 16 && b.x + 2 > t.x && b.y - 2 < t.y + 16 && b.y + 2 > t.y) {

  function updateBullets(){

      const a = bullets[i], c = bullets[j];
      if (!a.alive || !c.alive || a.isPlayer === c.isPlayer) continue;
      if (Math.abs(a.x - c.x) < 4 && Math.abs(a.y - c.y) < 4) { a.alive = false; c.alive = false; }

  }

  function updatePlayer(){
    const t = player;
    if (!t || !t.alive) return;

    if (t.shield > 0) { t.shield--; if (t.shield === 0) t.armor = false; }
    if (t.cool > 0) t.cool--;

  function chooseDir(t){
    const r = Math.random(), cx = t.x + 8, cy = t.y + 8;

      return dy > 0 ? 2 : (dx > 0 ? 1 : 3);
    }
    if (r < 0.6 && player) {
      const dx = player.x - t.x, dy = player.y - t.y;

      f.t++;

  function enterTally(isOver){

  function updateTally(){

      else { T.shown[T.row] = T.count; T.row++; T.count = 0; T.wait = 20; }

      else loadStage(stage + 1);

  function loadStage(n){

    baseAlive = true; freeze = 0; shovel = 0; kills = [0,0,0,0]; clearT = 0; over = null; respawnT = 0;

  // ---------- 绘制 ----------
  function hash(x, y, s){ return (((x * 73856093) ^ (y * 19349663) ^ (s * 83492791)) >>> 0) % 100 / 100; }
  function burst(x, y, r, seed){
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      const d = Math.hypot(dx, dy);
      const lim = r * (0.55 + 0.45 * hash(dx >> 1, dy >> 1, seed));
      if (d > lim) continue;
      rect(OX + x + dx, OY + y + dy, 1, 1, d < lim * 0.4 ? WHITE : d < lim * 0.75 ? "#D82800" : "#4428BC");
    }
  }
  function drawSpark(x, y, t){
    const s = [1, 2, 3, 4, 3, 2][(t >> 2) % 6], L = s * 2;
    const cx = OX + x + 8, cy = OY + y + 8;
    rect(cx - L, cy, L * 2 + 1, 1, WHITE);
    rect(cx, cy - L, 1, L * 2 + 1, WHITE);
    rect(cx - 1, cy - 1, 3, 3, WHITE);
    for (let i = 1; i <= s; i++) {
      rect(cx - i, cy - i, 1, 1, "#3CBCFC"); rect(cx + i, cy - i, 1, 1, "#3CBCFC");
      rect(cx - i, cy + i, 1, 1, "#3CBCFC"); rect(cx + i, cy + i, 1, 1, "#3CBCFC");
    }
  }
  function tankArt(t){
    if (!t.isPlayer) return t.type;
    return ["player", "basic", "power", "armor"][t.star] || "player";
  }
  function tankPal(t){
    if (t.isPlayer) return "player";
    if (t.bonus && ((tick >> 3) & 1)) return "red";
    if (t.type === "armor") return ["enemy", "enemy", "enemy", "gold", "green"][t.hp] || "enemy";
    return "enemy";
  }
  function drawSide(){
    for (let i = 0; i < queue.length; i++) ctx.drawImage(ENEMY_ICON, 232 + (i & 1) * 8, 24 + (i >> 1) * 8);
    drawText("IP", 232, 136, BLACK);
    ctx.drawImage(LIFE_ICON, 232, 144);
    drawText(String(Math.max(0, lives - 1)), 240, 144, BLACK);
    ctx.drawImage(FLAG, 232, 184);

  }
  function drawPlay(){
    rect(0, 0, W, H, GREY);
    rect(OX, OY, F, F, BLACK);
    renderTerrain();
    ctx.drawImage(terCv, OX, OY);
    ctx.drawImage(baseAlive ? EAGLE : EAGLE_DEAD, OX + 96, OY + 192);
    for (const t of tanks) {
      if (!t.alive) continue;
      if (t.spawnT > 0) { drawSpark(t.x, t.y, 60 - t.spawnT); continue; }
      ctx.drawImage(getTank(tankArt(t), tankPal(t), t.dir, (t.anim >> 2) & 1), OX + t.x, OY + t.y);
      if (t.shield > 0) ctx.drawImage(SHIELD[(tick >> 1) % 3], OX + t.x - 2, OY + t.y - 2);
    }
    for (const b of bullets) {
      if (b.dy) rect(OX + b.x - 1, OY + b.y - 2, 3, 4, "#BCBCBC");
      else rect(OX + b.x - 2, OY + b.y - 1, 4, 3, "#BCBCBC");
    }
    ctx.drawImage(grassCv, OX, OY);
    if (power && ((tick >> 3) & 1) === 0) ctx.drawImage(POWER_TEX[power.kind], OX + power.x, OY + power.y);
    for (const f of fx) {
      let r;
      if (f.t < 12) r = f.t < 4 ? 3 : f.t < 8 ? 5 : 7;
      else r = f.t < 18 ? 11 : f.t < 24 ? 15 : 11;
      burst(f.x | 0, f.y | 0, r, f.seed);
    }
    for (const p of pops) drawText(p.text, OX + p.x - p.text.length * 4, OY + p.y - 4, WHITE);
    if (over) {
      drawText("GAME", OX + (F - 32) / 2, OY + over.y, RED);
      drawText("OVER", OX + (F - 32) / 2, OY + over.y + 8, RED);
    }
    drawSide();
  }
  function drawMenu(){
    rect(0, 0, W, H, BLACK);
    const o = menuY | 0;
    drawText("I-", 24, 16 + o, WHITE);
    drawTextR(score ? String(score) : "00", 96, 16 + o, WHITE);
    drawText("HI-", 120, 16 + o, WHITE);
    drawTextR(String(hi), 192, 16 + o, WHITE);
    ctx.drawImage(BIG.battle, (W - BIG.battle.width) >> 1, 44 + o);
    ctx.drawImage(BIG.city, (W - BIG.city.width) >> 1, 84 + o);
    drawText("1 PLAYER", 88, 140 + o, WHITE);
    if (o === 0) ctx.drawImage(getTank("player", "player", 1, (tick >> 2) & 1), 64, 136);
  }
  function drawIntro(){
    if (intro > 128) {
      rect(0, 0, W, H, BLACK);
      const h = Math.ceil((H / 2) * (160 - intro) / 32);
      rect(0, 0, W, h, GREY); rect(0, H - h, W, h, GREY);
    } else if (intro > 32) {
      rect(0, 0, W, H, GREY);
      const s = "STAGE " + String(stage).padStart(2, " ");
      drawText(s, (W - s.length * 8) >> 1, 104, BLACK);
    } else {
      drawPlay();
      const h = Math.ceil((H / 2) * intro / 32);
      rect(0, 0, W, h, GREY); rect(0, H - h, W, h, GREY);
    }
  }
  function drawTally(){
    const T = tally;
    rect(0, 0, W, H, BLACK);
    drawText("HI-SCORE", 64, 24, RED); drawTextR(String(hi), 208, 24, ORANGE);
    drawText("STAGE", 96, 40, WHITE); drawTextR(String(stage), 168, 40, WHITE);
    drawText("I-PLAYER", 24, 56, RED); drawTextR(String(score), 88, 72, ORANGE);
    for (let i = 0; i < 4; i++) {
      const y = 96 + i * 24;
      let c = null;
      if (i < T.row) c = T.shown[i];
      else if (i === T.row && T.wait <= 0) c = T.count;
      if (c !== null) {
        drawTextR(String(c * EK[TYPES[i]].score), 64, y, WHITE);
        drawText("PTS", 72, y, WHITE);
        drawTextR(String(c), 120, y, WHITE);
      }
      drawText("←", 128, y, WHITE);
      ctx.drawImage(getTank(TYPES[i], "enemy", 0, 0), 140, y - 4);
    }
    rect(96, 186, 64, 2, WHITE);
    if (T.row >= 4) { drawText("TOTAL", 48, 192, WHITE); drawTextR(String(kills.reduce((a, b) => a + b, 0)), 120, 192, WHITE); }
  }
  function drawOver(){
    rect(0, 0, W, H, BLACK);
    ctx.drawImage(BIG.game, (W - BIG.game.width) >> 1, 72);
    ctx.drawImage(BIG.over, (W - BIG.over.width) >> 1, 112);
  }
  function draw(){
    ctx.imageSmoothingEnabled = false;
    if (state === "menu") drawMenu();
    else if (state === "intro") drawIntro();
    else if (state === "play" || state === "pause") {
      drawPlay();
      if (state === "pause" && ((tick >> 4) & 1) === 0) drawText("PAUSE", OX + (F - 40) / 2, OY + 96, RED);
    }
    else if (state === "clear") drawTally();
    else if (state === "over") drawOver();
  }

  function update(){
    tick++;
    if (state === "menu") { if (menuY > 0) menuY--; }
    else if (state === "intro") { intro--; if (intro === 32) sfx("start"); if (intro <= 0) { intro = 0; state = "play"; } }
    else if (state === "play") updatePlay();
    else if (state === "clear") updateTally();
    else if (state === "over") { if (++overT > 240) menu(); }
    engine(state === "play" && !!player, !!(player && player.moving));
  }
  let last = performance.now(), accum = 0;
  function frame(now){
    requestAnimationFrame(frame);
    accum += Math.min(100, now - last);
    last = now;
    while (accum >= 1000 / 60) { accum -= 1000 / 60; update(); }
    draw();
  }

  function countSteel(){ let n = 0; for (let i = 0; i < ter.length; i++) if (ter[i] === 2) n++; return n; }
  window.__tank = {
    start: startGame,
    goto(n){ loadStage(n); intro = 0; state = "play"; },
    armor(){ if (player) { player.armor = true; player.shield = 9999; player.spawnT = 0; } },
    snapshot(){ return { state, armor:!!(player && player.armor), steel:countSteel(), lives, score }; },
    testSteel(){
      const before = countSteel();
      for (let cy = 0; cy < N; cy++) for (let cx = 0; cx < N; cx++)
        if (ter[cy * N + cx] === 2) bulletHitsTile({ x:cx * 4 + 2, y:cy * 4 + 2, dx:1, dy:0, alive:true, isPlayer:true, power:true });
      return { before, after:countSteel() };
    },
    testArmor(){
      this.armor();
      const livesBefore = lives;
      hitPlayer();
      return { livesBefore, livesAfter:lives, armor:!!(player && player.armor), playerAlive:!!(player && player.alive) };
    }
  };

  window.addEventListener("keydown", e => {
    initAudio();
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
    if (e.repeat) return;
    if (e.code in DIRKEY) { const i = dirStack.indexOf(e.code); if (i >= 0) dirStack.splice(i, 1); dirStack.push(e.code); }
    held.add(e.code);
    if (e.code === "KeyM") muted = !muted;
    const startKey = e.code === "Enter" || e.code === "KeyP" || e.code === "Escape";
    if (state === "menu" && (startKey || FIREKEY.includes(e.code))) { if (menuY > 0) menuY = 0; else startGame(); }
    else if (state === "over" && (startKey || FIREKEY.includes(e.code))) menu();
    else if (startKey && (state === "play" || state === "pause")) pauseToggle();
  });
  window.addEventListener("keyup", e => {
    held.delete(e.code);
    const i = dirStack.indexOf(e.code);
    if (i >= 0) dirStack.splice(i, 1);
  });
  window.addEventListener("blur", () => { held.clear(); dirStack.length = 0; });

  menu();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
